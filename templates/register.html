{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2 class="mb-3"><i class="bi bi-person-plus"></i> Face Registration (3 Angles)</h2>
    <p class="text-muted">Follow the prompts: <strong>Front</strong> → <strong>Left ~30°</strong> → <strong>Right ~30°</strong>.
       Each capture is checked for blur / brightness / face size. If a slot shows ✗, click <em>Delete</em> and retake only that angle.</p>

    <div class="row g-4">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="ratio ratio-4x3 bg-black">
                        <video id="video" autoplay playsinline muted></video>
                    </div>
                    <canvas id="canvas" style="display:none;"></canvas>

                    <div class="d-flex align-items-center justify-content-between mt-3 gap-2 flex-wrap">
                        <button id="captureBtn" class="btn btn-primary">
                            <i class="bi bi-camera"></i> Capture
                        </button>
                        <button id="mirrorBtn" type="button" class="btn btn-outline-secondary btn-sm">Mirror: ON</button>
                        <span id="angleHint" class="badge bg-info fs-6">Current: Front</span>
                    </div>

                    <div id="preview" class="mt-3 d-flex gap-3 flex-wrap"></div>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Your Details</h5>
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" id="name" name="name" class="form-control"
                               placeholder="e.g. John Doe" autocomplete="name">
                    </div>
                    <div class="mb-3">
                        <label for="student_id" class="form-label">Student ID</label>
                        <input type="text" id="student_id" name="student_id" class="form-control"
                               placeholder="e.g. S12345" autocomplete="off">
                    </div>
                    <button id="submitBtn" class="btn btn-success w-100" disabled>
                        <i class="bi bi-check-circle"></i> Complete Registration
                    </button>
                    <div id="msg" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='js/register.js') }}"></script>
{% endblock %}
